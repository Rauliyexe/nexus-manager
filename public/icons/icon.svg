<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Clean Minimalist Aesthetic -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3026" />
      <stop offset="100%" stop-color="#111D15" />
    </linearGradient>
  </defs>

  <!-- iOS & Android Adaptive Squircle / Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="#2C4E3D" stroke-width="4" />

  <!-- Logo Mark Container (Scale and centered) -->
  <g transform="translate(116, 116)">
    <!-- Square Bracket / Frame -->
    <!-- Outer rectangle: 280x280, stroke thickness: 42 -->
    <!-- Top-Right Corner Open Gap for the distinct Dot Accent -->
    <path 
      d="M 210 21 L 21 21 L 21 259 L 259 259 L 259 90" 
      fill="none" 
      stroke="#76B38B" 
      stroke-width="42" 
      stroke-linecap="square" 
      stroke-linejoin="miter" 
    />

    <!-- Distinct Floating Accent Dot in the upper-right corner -->
    <circle cx="245" cy="35" r="26" fill="#76B38B" />
  </g>
</svg>
